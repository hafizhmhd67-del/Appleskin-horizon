name: Build AppleSkin HMOD

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust dengan WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools (Component Builder)
        uses: bytecodealliance/actions/wasm-tools/setup@v1

      - name: Compile ke WebAssembly
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Bungkus Menjadi Wasm Component
        run: |
          mkdir -p dist
          cp horizon-mod.toml dist/
          wasm-tools component new target/wasm32-unknown-unknown/release/appleskin.wasm -o dist/mod.wasm
          cd dist
          zip -r ../appleskin.hmod *
          cd ..

      - name: Upload HMOD Siap Pakai
        uses: actions/upload-artifact@v4
        with:
          name: AppleSkin-Horizon
          path: appleskin.hmod
