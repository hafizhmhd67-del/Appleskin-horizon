name: Build AppleSkin HMOD

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust dengan WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Alat Resmi Horizon
        run: cargo install --git https://github.com/horizon-rust/horizon cargo-horizon-mod

      - name: Rakit HMOD Otomatis
        run: cargo horizon-mod build --release

      - name: Upload HMOD Siap Pakai
        uses: actions/upload-artifact@v4
        with:
          name: AppleSkin-Horizon
          path: target/horizon-mod/*.hmod
